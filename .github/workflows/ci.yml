name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dashboard --extra dev --locked
      - run: uv run pytest --basetemp=/tmp/cesta-tests

  openclaw-plugin:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: integrations/openclaw-cesta
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/openclaw-cesta/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit

  hosted-dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/hosted-dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
